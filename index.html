<style>
/* Layout: one narrow centered column, a quiet orbit ring behind the name, two tall link plates */
:root{
  --bg:#F6F1EC; --surface:#FFFFFF; --ink:#2A2230; --muted:#6F6574;
  --bronze:#A67C52; --theta:#5B4B8A; --studio:#3E7C6E; --line:#E4DAD0;
  --display:"Frank Ruhl Libre","David",Georgia,serif;
  --body:"Assistant","Arial Hebrew",system-ui,sans-serif;
  --latin:"Playfair Display",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17141B; --surface:#221E28; --ink:#F1EAE3; --muted:#AFA4B3;
  --bronze:#D2A679; --theta:#A595DD; --studio:#7FC2B1; --line:#3A3341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141B; --surface:#221E28; --ink:#F1EAE3; --muted:#AFA4B3;
  --bronze:#D2A679; --theta:#A595DD; --studio:#7FC2B1; --line:#3A3341; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{direction:rtl;max-width:30rem;margin:0 auto;min-height:100%;
  padding-block:3.5rem 2.5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:2.25rem}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.orbit{width:9rem;height:9rem;max-width:100%;position:relative;display:grid;place-items:center}
.orbit svg{position:absolute;inset:0;width:100%;height:100%}
.orbit img{width:84%;height:84%;border-radius:50%;object-fit:cover;display:block}
h1{font-family:var(--display);font-weight:600;font-size:2rem;margin:0;text-wrap:balance}
.tag{color:var(--muted);margin:0;max-width:26ch}
nav{display:flex;flex-direction:column;gap:1rem}
.plate{display:flex;align-items:center;gap:1rem;text-decoration:none;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem;
  transition:transform .2s ease,border-color .2s ease}
.plate:hover{transform:translateY(-2px);border-color:var(--c)}
.plate:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.mark{flex:none;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;
  color:var(--c);border:1px solid var(--c)}
.txt{min-width:0;flex:1;display:flex;flex-direction:column}
.txt b{font-family:var(--display);font-weight:600;font-size:1.25rem}
.txt b i{font-family:var(--latin);font-weight:500;letter-spacing:.01em}
.txt small{color:var(--muted);font-size:.95rem}
.arrow{color:var(--c);font-size:1.3rem}
.sync{--c:var(--bronze)} .theta{--c:var(--theta)} .studio{--c:var(--studio)}
.soon{cursor:default}.soon:hover{transform:none;border-color:var(--line)}
.pill{flex:none;font-size:.8rem;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:.1rem .6rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:.04em;direction:ltr}
@media (prefers-reduced-motion:reduce){.plate{transition:none}.plate:hover{transform:none}}
</style>

</head>
